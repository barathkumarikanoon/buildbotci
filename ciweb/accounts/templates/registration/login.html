{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>Sign in</h1>
<form method="post" class="card authform">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include 'form_fields.html' %}
  <div class="actions"><button type="submit" class="btn primary">Sign in</button></div>
  <p class="muted small"><a href="{% url 'password_reset' %}">Forgot your password?</a> · <a href="{% url 'signup' %}">Create an account</a></p>
</form>
</div>
{% endblock %}
