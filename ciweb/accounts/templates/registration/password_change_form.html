{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>Change password</h1>
<form method="post" class="card authform">
  {% csrf_token %}
  {% include 'form_fields.html' %}
  <div class="actions"><button type="submit" class="btn primary">Change password</button></div>
  <p class="muted small">Changing the password signs you out on your other devices.</p>
</form>
</div>
{% endblock %}
