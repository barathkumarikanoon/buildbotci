{% extends 'base.html' %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>Choose a new password</h1>
{% if validlink %}
<form method="post" class="card authform">
  {% csrf_token %}
  {% include 'form_fields.html' %}
  <div class="actions"><button type="submit" class="btn primary">Change password</button></div>
</form>
{% else %}
<div class="card wide"><p>That reset link is not valid or has expired.</p><p><a href="{% url 'password_reset' %}">Ask for a new one</a></p></div>
{% endif %}
</div>
{% endblock %}
