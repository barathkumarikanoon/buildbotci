{% extends 'base.html' %}
{% block title %}Create an account{% endblock %}
{% block content %}
<div class="auth-wrap">
<h1>Create an account</h1>
<form method="post" class="card authform">
  {% csrf_token %}
  {% include 'form_fields.html' %}
  <div class="actions"><button type="submit" class="btn primary">Create account</button></div>
  <p class="muted small">New accounts are approved by an administrator. Already have one? <a href="{% url 'login' %}">Sign in</a>.</p>
</form>
</div>
{% endblock %}
