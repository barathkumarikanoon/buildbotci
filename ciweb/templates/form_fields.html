{% for error in form.non_field_errors %}<div class="flash error">{{ error }}</div>{% endfor %}
{% for field in form %}{% if not field.is_hidden %}
<label>{{ field.label }} {{ field }}
  {% if field.help_text %}<span class="muted small">{{ field.help_text|safe }}</span>{% endif %}
  {% for error in field.errors %}<span class="bad small">{{ error }}</span>{% endfor %}
</label>
{% else %}{{ field }}{% endif %}{% endfor %}
