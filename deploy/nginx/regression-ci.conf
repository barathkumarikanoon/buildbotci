# HTTPS in front of the web UI. Replace ci.example.com and the certificate paths.
# With this in place set, in bb-master.env:
#   REG_UI_URL=https://ci.example.com  REG_UI_BEHIND_PROXY=1  REG_UI_SECURE_COOKIES=1
# and, once you are sure HTTPS works, REG_UI_HSTS_SECONDS=31536000 and REG_UI_SSL_REDIRECT=1.
server {
    listen 80;
    server_name ci.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ci.example.com;

    ssl_certificate     /etc/ssl/certs/ci.example.com.pem;
    ssl_certificate_key /etc/ssl/private/ci.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8020;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
