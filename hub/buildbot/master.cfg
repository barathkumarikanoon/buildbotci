# Buildbot master configuration of the CI.
#
# Nothing here is specific to one repository. The repos (their branches, workers, schedules, test suites) are the
# *repo profiles* that people edit in the web UI; the UI writes them to a snapshot file and this file turns every
# enabled profile into Buildbot workers, schedulers and builders (hub/buildbot/repo_config.py). The master follows
# changes of the snapshot by itself (hub/buildbot/watcher.py), so adding a repo needs no edit here and no restart.
#
# This file is copied to the master folder (see CLAUDE.md, "After you change something"); the rest is read from
# CI_DIR each time the master starts or reloads.
import importlib
import os
import sys
from urllib.parse import urlparse

from buildbot.plugins import util


def setting(name):
    """A setting that has no default: the master refuses to load without it."""
    value = os.environ.get(name)
    if not value:
        raise RuntimeError('%s is not set. Put it in the settings file (~/bb-master.env).' % name)
    return value


def path_setting(name, required = False):
    """A folder or file from the settings file, written as ~/x, $HOME/x or an absolute path. systemd passes it on
    as it is, and the commands the master starts never expand it, so it is expanded here, once."""
    value = setting(name) if required else os.environ.get(name, '')
    return os.path.abspath(os.path.expanduser(os.path.expandvars(value))) if value else ''


CI_DIR = path_setting('CI_DIR', required = True)
if CI_DIR not in sys.path:
    sys.path.insert(0, CI_DIR)

# Python keeps imported modules for the life of the process: reload ours so that `buildbot reconfig` sees code changes.
for _name in ('hub.store', 'hub.repos', 'hub.adapters.base', 'hub.adapters.process', 'hub.adapters.comparison',
              'hub.adapters.command', 'hub.adapters.pytest_suite', 'hub.adapters', 'hub.buildbot.repo_config',
              'hub.buildbot.cleanup', 'hub.buildbot.watcher'):
    importlib.reload(importlib.import_module(_name))

from hub import repos                                                # noqa: E402
from hub.buildbot import repo_config, watcher                        # noqa: E402

c = BuildmasterConfig = {}

BB_URL        = setting('BUILDBOT_URL')
INTERNAL_URL  = setting('CI_BUILDBOT_URL')
WWW_PORT      = int(os.environ.get('BUILDBOT_WWW_PORT', '8010'))
WWW_INTERFACE = os.environ.get('BUILDBOT_WWW_INTERFACE', '')
WORKER_PORT      = int(os.environ.get('BUILDBOT_WORKER_PORT', '9989'))
WORKER_INTERFACE = os.environ.get('BUILDBOT_WORKER_INTERFACE', '')
ADMIN_USER = os.environ.get('BUILDBOT_ADMIN_USER', 'admin')
# The web UI signs in with CI_BUILDBOT_USER, so that is the account created here unless BUILDBOT_UI_USER says otherwise.
UI_USER    = os.environ.get('BUILDBOT_UI_USER') or os.environ.get('CI_BUILDBOT_USER') or 'ci-ui'

shared = repo_config.settings_from_environment(os.environ, path_setting)
shared.profiles_file = repos.default_snapshot_path(shared.results_dir)

c['buildbotNetUsageData'] = None
c['title']        = os.environ.get('CI_UI_SITE_NAME', 'Indian Kanoon CI')
c['buildbotURL']  = BB_URL
c['db']           = {'db_url': setting('BUILDBOT_DB_URL')}
c['collapseRequests'] = False
c['protocols'] = {'pb': {'port': 'tcp:%d:interface=%s' % (WORKER_PORT, WORKER_INTERFACE) if WORKER_INTERFACE else WORKER_PORT}}

# ---- one set of workers, schedulers and builders for every enabled repo profile ----------------------------------
c['workers'], c['schedulers'], c['builders'] = [], [], []
PROFILES = repos.load_repos(shared.profiles_file)
for _repo in PROFILES.values():
    _workers, _schedulers, _builders = repo_config.build_repo(_repo, shared)
    c['workers']    += _workers
    c['schedulers'] += _schedulers
    c['builders']   += _builders
if not PROFILES:
    c['workers'], c['schedulers'], c['builders'] = repo_config.idle_config(shared)

_seen = set()
for _worker in c['workers']:
    if _worker.workername in _seen:
        raise RuntimeError('The worker %s is used by two repository profiles; every repository needs its own workers.' % _worker.workername)
    _seen.add(_worker.workername)

# ---- follow changes of the profiles ---------------------------------------------------------------------------
c['services'] = [watcher.ProfilesWatcher(path = shared.profiles_file, loaded = watcher.file_version(shared.profiles_file))]

# ---- who may do what in Buildbot's own pages --------------------------------------------------------------------
users = {ADMIN_USER: setting('BUILDBOT_ADMIN_PASSWORD')}
if os.environ.get('BUILDBOT_UI_PASSWORD'):
    users[UI_USER] = os.environ['BUILDBOT_UI_PASSWORD']


class StopOrCancelMatcher(util.StopBuildEndpointMatcher):
    """Buildbot's stop rule covers a queued build request only under the action name `stop`, but cancelling one is
    sent as `cancel`, which would then need the `admins` role. Treat both the same, so the web UI's account can stop a
    run that is still waiting in the queue. Which person may stop which run is decided by the web UI."""
    match_BuildRequestEndpoint_cancel = util.StopBuildEndpointMatcher.match_BuildRequestEndpoint_stop


def origin(url):
    parts = urlparse(url)
    return '%s://%s' % (parts.scheme, parts.netloc)


c['www'] = {
    'port': 'tcp:%d:interface=%s' % (WWW_PORT, WWW_INTERFACE) if WWW_INTERFACE else WWW_PORT,
    'allowed_origins': sorted({origin(BB_URL), origin(INTERNAL_URL)}),
    'plugins': {},
    'auth': util.UserPasswordAuth(users),
    'authz': util.Authz(
        allowRules = [
            util.ForceBuildEndpointMatcher(role = 'forcers'),
            StopOrCancelMatcher(role = 'forcers'),
            util.AnyControlEndpointMatcher(role = 'admins'),
        ],
        roleMatchers = [
            util.RolesFromUsername(roles = ['admins', 'forcers'], usernames = [ADMIN_USER]),
            util.RolesFromUsername(roles = ['forcers'], usernames = [UI_USER]),
        ],
    ),
}
