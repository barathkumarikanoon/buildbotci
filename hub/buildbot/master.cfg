def branch_codebase(branch):
    return {'': {'repository': '', 'branch': branch, 'revision': None}}


def branch_form(label):
    return util.CodebaseParameter(
        '',
        label = 'Source',
        branch = util.ChoiceStringParameter(name = 'branch', label = label, choices = BRANCHES, default = BRANCHES[0]),
        revision = util.FixedParameter(name = 'revision', default = ''),
        repository = util.FixedParameter(name = 'repository', default = ''),
        project = util.FixedParameter(name = 'project', default = ''),
    )


c['schedulers'] = [
    schedulers.Nightly(
        name = '%s-%s' % (PUSH_SCHEDULER, branch),
        branch = branch,
        codebases = branch_codebase(branch),
        minute = CRON_MINUTE,
        hour = CRON_HOUR,
        builderNames = [BUILDER_NAME],
    ) for branch in BRANCHES
] + [
    schedulers.ForceScheduler(
        name = FORCE_SCHEDULER,
        builderNames = [BUILDER_NAME],
        buttonName = 'Run regressions',
        codebases = [branch_form('Branch (git fetch origin, then its latest commit)')],
        properties = [
            util.StringParameter(name = 'tests', label = 'Tests (modules, ids or globs; empty = all modules)', default = '', size = 80),
            util.StringParameter(name = 'run_id', label = 'Run id (set by the UI)', default = ''),
            util.StringParameter(name = 'requested_by', label = 'Requested by', default = ''),
        ],
    ),
    schedulers.ForceScheduler(
        name = CATALOG_FORCE,
        builderNames = [CATALOG_BUILDER],
        buttonName = 'Refresh test list',
        codebases = [branch_form('Branch')],
    ),
] + [
    schedulers.Triggerable(
        name = SHARD_SCHEDULER % index,
        builderNames = [SHARD_BUILDER],
        properties = {'shard_index': str(index)},
    ) for index in range(1, MAX_SHARDS + 1)
]


def scheduled(props):
    return (props.getProperty('scheduler') or '').startswith(PUSH_SCHEDULER)


@util.renderer
def trigger_name(props):
    return 'push' if scheduled(props) else 'manual'


@util.renderer
def requested_by_arg(props):
    if scheduled(props):
        return 'Auto'
    return props.getProperty('requested_by') or props.getProperty('owner') or ''


@util.renderer
def reason_arg(props):
    if scheduled(props):
        return 'Scheduled run (%s)' % props.getProperty('scheduler')
    reason = props.getProperty('reason') or ''
    who    = props.getProperty('requested_by') or ''
    prefix = '%s: ' % who
    if who and reason.startswith(prefix):
        return reason[len(prefix):]
    return reason


@util.renderer
def tests_arg(props):
    if scheduled(props):
        return 'all'
    return (props.getProperty('tests') or '').strip() or 'all'


RESULTS_ENV = {
    'REG_RESULTS_DIR': RESULTS_DIR,
    'REG_UI_URL': UI_URL,
    'REGRESSION_PROFILE': PROFILE,
    'PYTHONUNBUFFERED': '1',
}
if os.environ.get('REG_REPO_DIR'):
    RESULTS_ENV['REG_REPO_DIR'] = path_setting('REG_REPO_DIR')

BRANCH      = util.Interpolate('%(prop:branch)s')
REVISION    = util.Interpolate('%(prop:tested_revision)s')
RUN_DIR     = util.Interpolate('run-%(prop:buildnumber)s')
RUN_TREE    = util.Interpolate('run-%(prop:buildnumber)s/indianlaw')


def runner(*arguments, tree = None):
    command = [PYTHON, CI_RUNNER]
    if tree:
        command += ['--repo-dir', tree]
    return command + list(arguments)


def extract_sync(rc, stdout, stderr):
    found = {}
    for line in stdout.splitlines():
        if line.startswith('REVISION: '):
            found['tested_revision'] = line[len('REVISION: '):].strip()
        elif line.startswith('ACTION: '):
            found['sync_action'] = line[len('ACTION: '):].strip()
    return found


def extract_plan(rc, stdout, stderr):
    found = {}
    for line in stdout.splitlines():
        if line.startswith('RUN_ID: '):
            found['plan_run_id'] = line[len('RUN_ID: '):].strip()
        elif line.startswith('SHARDS: '):
            found['shard_count'] = int(line[len('SHARDS: '):].strip())
    return found


class ShardTrigger(steps.Trigger):
    def getSchedulersAndProperties(self):
        count = int(self.getProperty('shard_count', 0) or 0)
        return [{'sched_name': SHARD_SCHEDULER % index, 'props_to_set': self.set_properties,
                 'unimportant': False} for index in range(1, count + 1)]


def wanted(step):
    return step.getProperty('sync_action') == 'run'


def has_shards(step):
    return int(step.getProperty('shard_count', 0) or 0) > 0


def has_run(step):
    return bool(step.getProperty('plan_run_id') or step.getProperty('run_id'))


factory = util.BuildFactory()
factory.addStep(ShellCommand(
    name = 'remove old checkouts',
    workdir = '.',
    command = runner('sweep', '--base', WORKERS_DIR, '--buildbot-url', INTERNAL_URL),
    env = RESULTS_ENV,
    usePTY = False,
    haltOnFailure = False,
    flunkOnFailure = False,
    warnOnFailure = False,
))
factory.addStep(SetPropertyFromCommand(
    name = 'git fetch origin',
    workdir = '.',
    command = runner('sync', '--branch', BRANCH, '--trigger', trigger_name),
    extract_fn = extract_sync,
    env = RESULTS_ENV,
    haltOnFailure = True,
))
factory.addStep(ShellCommand(
    name = 'checkout',
    workdir = '.',
    command = runner('checkout', '--dest', RUN_TREE, '--revision', REVISION),
    env = RESULTS_ENV,
    usePTY = False,
    doStepIf = wanted,
    haltOnFailure = True,
))
factory.addStep(SetPropertyFromCommand(
    name = 'plan',
    workdir = RUN_DIR,
    command = runner(
        'plan',
        '--profile', PROFILE,
        '--branch', BRANCH,
        '--tests', tests_arg,
        '--run-id', util.Interpolate('%(prop:run_id:-)s'),
        '--requested-by', requested_by_arg,
        '--reason', reason_arg,
        '--trigger', trigger_name,
        '--build-number', util.Interpolate('%(prop:buildnumber)s'),
        '--build-url', util.URLForBuild,
        '--max-shards', str(MAX_SHARDS),
        tree = 'indianlaw',
    ),
    extract_fn = extract_plan,
    env = RESULTS_ENV,
    doStepIf = wanted,
    haltOnFailure = True,
))
factory.addStep(ShardTrigger(
    name = 'modules',
    schedulerNames = [SHARD_SCHEDULER % 1],
    waitForFinish = True,
    set_properties = {'run_id': util.Property('plan_run_id'), 'tested_revision': util.Property('tested_revision')},
    doStepIf = has_shards,
    hideStepIf = lambda results, step: not has_shards(step),
    flunkOnFailure = False,
    warnOnFailure = False,
    haltOnFailure = False,
))
factory.addStep(ShellCommand(
    name = 'finalize',
    workdir = RUN_DIR,
    command = runner('finalize', '--run-id', util.Interpolate('%(prop:plan_run_id:-%(prop:run_id:-)s)s'), tree = 'indianlaw'),
    env = RESULTS_ENV,
    usePTY = False,
    alwaysRun = True,
    doStepIf = has_run,
    haltOnFailure = False,
))
factory.addStep(ShellCommand(
    name = 'release checkout',
    workdir = '.',
    command = runner('release', '--dest', RUN_TREE),
    env = RESULTS_ENV,
    usePTY = False,
    alwaysRun = True,
    doStepIf = wanted,
    flunkOnFailure = False,
    warnOnFailure = False,
))
factory.addStep(steps.RemoveDirectory(
    name = 'clean up',
    dir = RUN_DIR,
    alwaysRun = True,
    doStepIf = wanted,
    flunkOnFailure = False,
    warnOnFailure = False,
))

